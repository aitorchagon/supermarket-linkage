[project]
name = "record-linkage-supermarket-online"
version = "0.1.0"
description = "Record linkage shopping-list matcher for Spanish supermarkets (Mercadona v1)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0,<2.0",
    "polars-distance>=0.4",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.35",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supermarket_linkage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "live: opt-in live HTTP; skipped unless RUN_LIVE_MERCADONA=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
