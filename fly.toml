# Worker FastAPI + MiniLM. Scale-to-zero when idle (cold start loads the model again).

app = 'supermarket-linkage-worker'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile.worker'

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
