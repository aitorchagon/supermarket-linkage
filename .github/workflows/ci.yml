name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Pytest (unit + integration + benchmark, no live HTTP)
        env:
          RUN_LIVE_MERCADONA: "0"
          USE_SAMPLE_CATALOG: "1"
          SKIP_MODEL_PRELOAD: "1"
        run: >
          uv run pytest
          tests/unit
          tests/integration
          tests/benchmark
          -q
          --tb=short
          -m "not live"

  lint:
    name: Ruff (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Style debt is large; do not block merges until cleaned up.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format (check only)
        run: uv run ruff format --check src tests
